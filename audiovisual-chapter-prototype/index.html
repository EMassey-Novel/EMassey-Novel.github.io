<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiovisual Chapter Prototype</title>
    <style>
      :root {
        --bg: #0d0d0f;
        --panel: #17181d;
        --text: #f1f1f1;
        --muted: #a9a9b2;
        --accent: #9f7aea;
        --accent-2: #6ee7b7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      .hero {
        padding: 3rem 0 1rem;
        text-align: center;
      }
      h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }
      .subtitle {
        color: var(--muted);
        font-size: 1.1rem;
      }
      .panel {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 1rem;
        margin-top: 1.5rem;
      }
      .audio-wrap {
        display: grid;
        gap: 1rem;
        margin-top: 1rem;
      }
      audio {
        width: 100%;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .gallery img {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        display: block;
      }
      .foot {
        text-align: center;
        color: var(--muted);
        margin-top: 2rem;
      }
      a {
        color: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>Audiovisual Chapter Prototype</h1>
        <div class="subtitle">Prototype experience for the chapter project.</div>
      </header>

      <section class="panel">
        <h2>Audio</h2>
        <div class="audio-wrap">
          <audio controls preload="auto">
            <source src="audio/entry_two.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
          <audio controls preload="auto">
            <source src="audio/narration.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
        </div>
      </section>

      <section class="panel">
        <h2>Images</h2>
        <div class="gallery">
          <img src="img/01_rinelle-image8.webp" alt="Rinelle image 1" />
          <img src="img/02_rinelle-image2.webp" alt="Rinelle image 2" />
          <img src="img/03_rinelle3.webp" alt="Rinelle image 3" />
          <img src="img/04_rinelle-image6.webp" alt="Rinelle image 4" />
          <img src="img/05_rinelle-image7.webp" alt="Rinelle image 5" />
          <img src="img/06_rinelle-image.webp" alt="Rinelle image 6" />
        </div>
      </section>

      <div class="foot">
        Prototype folder renamed to <strong>audiovisual-chapter-prototype</strong>.<br />
        Created from the existing prototype_j project files.
      </div>
    </div>
  </body>
</html>
